# Giữ dự án Supabase gói Free không bị tạm dừng vì «ít người dùng» (Supabase tạm dừng dự án Free sau 7 ngày ít hoạt động; tài liệu của họ nói vài lượt gọi API mỗi ngày là đủ để không bị dừng).
# Mỗi ngày gọi 3 lệnh ĐỌC bằng khoá CÔNG KHAI (khoá này vốn đã nằm trong assets/js/core/config.js). Các bảng có bảo vệ RLS nên chỉ trả về [] (không lộ dữ liệu). Không cần mật khẩu hay khoá bí mật nào.
# Nếu dự án đã bị tạm dừng hoặc máy chủ lỗi, lệnh gọi thất bại và GitHub gửi mail «workflow failed» cho chủ kho: coi đó là chuông báo.
# Muốn tắt: xoá tệp này khỏi kho, hoặc vào tab Actions → «Giu hoat dong Supabase» → ⋯ → Disable workflow.
# Lưu ý: GitHub tự TẮT workflow theo lịch của kho công khai khi 60 ngày liền kho không có hoạt động (commit). Nhận mail báo thì vào tab Actions bấm Enable; mỗi lần cập nhật app (commit) thì bộ đếm 60 ngày tính lại.
# Nếu đổi sang dự án Supabase khác: sửa SUPABASE_URL và SUPABASE_KEY bên dưới cho khớp assets/js/core/config.js.
name: Giu hoat dong Supabase
on:
  schedule:
    - cron: '17 3 * * *'      # 03:17 UTC mỗi ngày = 10:17 giờ Việt Nam
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Goi API Supabase (chi doc)
        env:
          SUPABASE_URL: https://nrknwplyjrtbbgapwdsq.supabase.co
          SUPABASE_KEY: sb_publishable_ciBfi0gKODgaku1JqtOjBg_CTc--HB4
        run: |
          set -eu
          for bang in lop hoc_sinh bai_giao; do
            ma=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/$bang?select=id&limit=1")
            echo "$bang -> HTTP $ma"
            [ "$ma" = "200" ] || exit 1
          done
